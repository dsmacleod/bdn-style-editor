<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BDN Style Editor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='25' cy='75' r='12' fill='none' stroke='%23228B22' stroke-width='7'/%3E%3Ccircle cx='25' cy='25' r='12' fill='none' stroke='%23228B22' stroke-width='7'/%3E%3Cline x1='33' y1='67' x2='80' y2='20' stroke='%23228B22' stroke-width='7' stroke-linecap='round'/%3E%3Cline x1='33' y1='33' x2='80' y2='80' stroke='%23228B22' stroke-width='7' stroke-linecap='round'/%3E%3Cline x1='57' y1='43' x2='80' y2='20' stroke='%23228B22' stroke-width='7' stroke-linecap='round'/%3E%3Cline x1='57' y1='57' x2='80' y2='80' stroke='%23228B22' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E" type="image/svg+xml">
<style>
  :root {
    --navy: #003366;
    --navy-light: #004488;
    --red: #c0392b;
    --red-bg: #fde8e6;
    --yellow: #b8860b;
    --yellow-bg: #fef9e7;
    --blue: #2471a3;
    --blue-bg: #e8f0fe;
    --green: #27ae60;
    --green-bg: #e8f8f0;
    --gray-light: #f5f5f5;
    --gray-border: #ddd;
    --gray-mid: #999;
    --text: #222;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Georgia, "Times New Roman", serif;
    color: var(--text);
    background: var(--gray-light);
    line-height: 1.6;
  }

  header {
    background: var(--navy);
    color: #fff;
    padding: 0.8rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  header h1 {
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  header h1 span { font-weight: 400; opacity: 0.8; }

  .header-right {
    display: flex;
    align-items: center;
    gap: 1rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 0.8rem;
    opacity: 0.7;
  }

  kbd {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 3px;
    padding: 1px 5px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 0.75rem;
  }

  .container {
    max-width: 1440px;
    margin: 0 auto;
    padding: 1.25rem;
  }

  /* Input section */
  .input-section {
    background: #fff;
    border: 1px solid var(--gray-border);
    border-radius: 6px;
    padding: 1.25rem;
    margin-bottom: 1.25rem;
  }

  .input-fields {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }

  .field-group { position: relative; }

  .field-group label {
    display: block;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--navy);
    margin-bottom: 0.3rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .field-group label .optional {
    font-weight: 400;
    text-transform: none;
    opacity: 0.6;
    letter-spacing: 0;
  }

  input[type="text"] {
    width: 100%;
    padding: 0.6rem 0.8rem;
    border: 1px solid var(--gray-border);
    border-radius: 4px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text);
  }

  input[type="text"]:focus { outline: 2px solid var(--navy-light); border-color: var(--navy-light); }

  textarea {
    width: 100%;
    min-height: 180px;
    padding: 0.8rem;
    border: 1px solid var(--gray-border);
    border-radius: 4px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1rem;
    line-height: 1.7;
    resize: vertical;
    color: var(--text);
  }

  textarea:focus { outline: 2px solid var(--navy-light); border-color: var(--navy-light); }

  .copy-input {
    width: 100%;
    min-height: 180px;
    padding: 0.8rem;
    border: 1px solid var(--gray-border);
    border-radius: 4px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1rem;
    line-height: 1.7;
    color: var(--text);
    overflow-y: auto;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .copy-input:empty::before {
    content: attr(data-placeholder);
    color: #999;
    pointer-events: none;
  }

  .copy-input:focus { outline: 2px solid var(--navy-light); border-color: var(--navy-light); }

  .copy-input a {
    color: var(--blue);
    text-decoration: underline;
  }

  .input-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin-top: 0.75rem;
    flex-wrap: wrap;
  }

  .btn-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .stats-row {
    display: flex;
    gap: 1.25rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 0.8rem;
    color: var(--gray-mid);
  }

  .stats-row span strong {
    color: var(--text);
    font-weight: 600;
  }

  .btn {
    border: none;
    padding: 0.55rem 1.5rem;
    font-size: 0.9rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-weight: 600;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
  }

  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-primary { background: var(--navy); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--navy-light); }

  .btn-secondary {
    background: #fff;
    color: var(--navy);
    border: 1px solid var(--navy);
  }
  .btn-secondary:hover:not(:disabled) { background: var(--gray-light); }

  .btn-sm {
    padding: 0.3rem 0.8rem;
    font-size: 0.8rem;
  }

  .spinner {
    display: none;
    width: 20px;
    height: 20px;
    border: 3px solid var(--gray-border);
    border-top-color: var(--navy);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  .spinner.active { display: inline-block; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .status-msg {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 0.82rem;
    color: #666;
  }

  .error-msg {
    color: var(--red);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 0.9rem;
    margin-top: 0.5rem;
  }

  /* Score summary */
  .score-bar {
    display: none;
    background: #fff;
    border: 1px solid var(--gray-border);
    border-radius: 6px;
    padding: 1rem 1.25rem;
    margin-bottom: 1.25rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .score-bar.visible { display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; }

  .score-grade {
    font-size: 2rem;
    font-weight: 800;
    line-height: 1;
    min-width: 2.5rem;
    text-align: center;
  }

  .score-breakdown {
    display: flex;
    gap: 1.5rem;
    font-size: 0.85rem;
    flex: 1;
  }

  .score-cat {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .score-dot {
    width: 10px;
    height: 10px;
    border-radius: 2px;
  }

  .score-actions {
    display: flex;
    gap: 0.5rem;
    margin-left: auto;
  }

  .progress-text {
    font-size: 0.82rem;
    color: var(--gray-mid);
  }

  /* Filter toggles */
  .filter-bar {
    display: none;
    gap: 0.5rem;
    margin-bottom: 1rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .filter-bar.visible { display: flex; flex-wrap: wrap; align-items: center; }

  .filter-btn {
    padding: 0.3rem 0.8rem;
    font-size: 0.8rem;
    border-radius: 20px;
    border: 1px solid var(--gray-border);
    background: #fff;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }

  .filter-btn.active { border-color: currentColor; font-weight: 600; }
  .filter-btn.active.f-style { color: var(--red); background: var(--red-bg); }
  .filter-btn.active.f-tighten { color: var(--yellow); background: var(--yellow-bg); }
  .filter-btn.active.f-structure { color: var(--blue); background: var(--blue-bg); }

  .filter-count {
    font-size: 0.75rem;
    opacity: 0.7;
  }

  /* Results layout */
  .results {
    display: none;
    gap: 1.25rem;
  }

  .results.visible {
    display: grid;
    grid-template-columns: 1fr 400px;
  }

  .text-panel, .issues-panel {
    background: #fff;
    border: 1px solid var(--gray-border);
    border-radius: 6px;
    padding: 1.25rem;
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 2px solid var(--navy);
  }

  .panel-header h2 {
    font-size: 1.05rem;
    color: var(--navy);
  }

  .text-display {
    font-size: 1rem;
    line-height: 1.8;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .highlight {
    cursor: pointer;
    border-radius: 2px;
    padding: 1px 2px;
    transition: outline 0.15s;
  }

  .highlight:hover { outline: 2px solid currentColor; }

  .highlight-style { background: var(--red-bg); color: var(--red); }
  .highlight-tighten { background: var(--yellow-bg); color: var(--yellow); }
  .highlight-structure { background: var(--blue-bg); color: var(--blue); }
  .highlight.active-highlight { outline: 2px solid currentColor; }
  .highlight.accepted { background: var(--green-bg); color: var(--green); text-decoration: line-through; opacity: 0.6; }
  .highlight.dismissed { opacity: 0.3; }
  .highlight.filtered-out { background: none; color: inherit; cursor: default; outline: none; }

  /* Issues list */
  .issues-panel { max-height: calc(100vh - 200px); display: flex; flex-direction: column; }
  .issues-scroll { overflow-y: auto; flex: 1; }
  .issues-list { list-style: none; }

  .issue-item {
    padding: 0.65rem 0.75rem;
    margin-bottom: 0.5rem;
    border-radius: 4px;
    border-left: 4px solid var(--gray-border);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 0.85rem;
    transition: background 0.15s, opacity 0.15s;
  }

  .issue-item:hover { background: var(--gray-light); }
  .issue-item.active-issue { background: var(--gray-light); outline: 2px solid var(--navy); }

  .issue-item.cat-style { border-left-color: var(--red); }
  .issue-item.cat-tighten { border-left-color: var(--yellow); }
  .issue-item.cat-structure { border-left-color: var(--blue); }

  .issue-item.resolved { opacity: 0.45; }
  .issue-item.resolved .issue-actions { display: none; }

  .issue-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }

  .issue-top-left {
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }

  .issue-num {
    display: inline-block;
    font-weight: 700;
    font-size: 0.75rem;
    width: 1.5em;
    height: 1.5em;
    line-height: 1.5em;
    text-align: center;
    border-radius: 50%;
    color: #fff;
    flex-shrink: 0;
  }

  .cat-style .issue-num { background: var(--red); }
  .cat-tighten .issue-num { background: var(--yellow); }
  .cat-structure .issue-num { background: var(--blue); }

  .issue-cat-label {
    font-weight: 600;
    font-size: 0.8rem;
  }

  .issue-original {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    color: #555;
    margin: 0.25rem 0;
    font-size: 0.85rem;
    line-height: 1.4;
  }

  .issue-suggestion {
    font-weight: 600;
    margin: 0.25rem 0;
    color: var(--green);
  }

  .issue-explanation {
    color: #555;
    font-size: 0.8rem;
    line-height: 1.45;
  }

  .issue-actions {
    display: flex;
    gap: 0.4rem;
    margin-top: 0.4rem;
  }

  .btn-accept {
    background: var(--green);
    color: #fff;
    border: none;
    padding: 0.2rem 0.6rem;
    font-size: 0.75rem;
    border-radius: 3px;
    cursor: pointer;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-weight: 600;
  }
  .btn-accept:hover { background: #219a52; }

  .btn-dismiss {
    background: transparent;
    color: var(--gray-mid);
    border: 1px solid var(--gray-border);
    padding: 0.2rem 0.6rem;
    font-size: 0.75rem;
    border-radius: 3px;
    cursor: pointer;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .btn-dismiss:hover { background: var(--gray-light); }

  .issue-status {
    font-size: 0.75rem;
    font-weight: 600;
    margin-top: 0.3rem;
  }

  .status-accepted { color: var(--green); }
  .status-dismissed { color: var(--gray-mid); }

  .legend {
    display: flex;
    gap: 1.25rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 0.78rem;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 2px;
  }

  .no-issues {
    text-align: center;
    padding: 2rem;
    color: #666;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* Toast notification */
  .toast {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    background: var(--navy);
    color: #fff;
    padding: 0.6rem 1.2rem;
    border-radius: 6px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 0.85rem;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
    pointer-events: none;
    z-index: 100;
  }

  .toast.show { opacity: 1; transform: translateY(0); }

  /* Headline analysis bar */
  .headline-bar {
    display: none;
    background: #fff;
    border: 1px solid var(--gray-border);
    border-radius: 6px;
    padding: 1rem 1.25rem;
    margin-bottom: 1.25rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    flex-direction: column;
    gap: 0.5rem;
  }

  .headline-bar.visible { display: flex; }
  .headline-bar.score-strong { border-left: 4px solid var(--green); }
  .headline-bar.score-adequate { border-left: 4px solid var(--yellow); }
  .headline-bar.score-weak { border-left: 4px solid var(--red); }

  .headline-bar-top {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
  }

  .headline-score-badge {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 0.15rem 0.5rem;
    border-radius: 3px;
    color: #fff;
  }

  .score-strong .headline-score-badge { background: var(--green); }
  .score-adequate .headline-score-badge { background: var(--yellow); }
  .score-weak .headline-score-badge { background: var(--red); }

  .headline-bar-title {
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--navy);
  }

  .headline-ws {
    font-size: 0.8rem;
    color: var(--gray-mid);
    margin-left: auto;
  }

  .headline-ws .w-answered {
    font-weight: 600;
    color: var(--green);
  }

  .headline-ws .w-missing {
    color: var(--gray-mid);
    opacity: 0.5;
  }

  .headline-assessment {
    font-size: 0.85rem;
    color: #444;
    line-height: 1.5;
  }

  .headline-details {
    display: flex;
    gap: 1rem;
    font-size: 0.8rem;
    flex-wrap: wrap;
  }

  .headline-detail-item {
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }

  .headline-detail-label {
    color: var(--gray-mid);
  }

  .headline-detail-value {
    font-weight: 600;
  }

  .red-flag-tag {
    background: var(--red-bg);
    color: var(--red);
    padding: 0.1rem 0.4rem;
    border-radius: 3px;
    font-size: 0.75rem;
    font-weight: 600;
  }

  .headline-rewrite {
    display: none;
    background: var(--gray-light);
    border-radius: 4px;
    padding: 0.6rem 0.8rem;
    font-size: 0.9rem;
    line-height: 1.4;
  }

  .headline-rewrite.visible { display: block; }

  .headline-rewrite-label {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--navy);
    margin-bottom: 0.2rem;
  }

  .headline-rewrite-text {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    color: var(--text);
  }

  /* Nut graf bar */
  .nut-graf-bar {
    display: none;
    background: #fff;
    border: 1px solid var(--gray-border);
    border-radius: 6px;
    padding: 0.8rem 1.25rem;
    margin-bottom: 1.25rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    align-items: flex-start;
    gap: 0.75rem;
  }

  .nut-graf-bar.visible { display: flex; }
  .nut-graf-bar.found { border-left: 4px solid var(--green); }
  .nut-graf-bar.missing { border-left: 4px solid var(--red); }

  .nut-graf-icon { font-size: 1.3rem; flex-shrink: 0; margin-top: 0.1rem; }

  .nut-graf-label {
    font-weight: 700;
    font-size: 0.85rem;
    margin-bottom: 0.2rem;
  }

  .nut-graf-bar.found .nut-graf-label { color: var(--green); }
  .nut-graf-bar.missing .nut-graf-label { color: var(--red); }

  .nut-graf-detail {
    font-size: 0.85rem;
    color: #555;
    line-height: 1.5;
  }

  .nut-graf-detail em {
    font-family: Georgia, "Times New Roman", serif;
    color: var(--text);
  }

  @media (max-width: 960px) {
    .results.visible { grid-template-columns: 1fr; }
    .issues-panel { max-height: none; }
    header { flex-direction: column; align-items: flex-start; }
    .score-actions { margin-left: 0; }
  }
</style>
</head>
<body>

<header>
  <h1>BDN Style Editor <span>| AP &amp; House Style Checker</span></h1>
  <div class="header-right">
    <span><kbd>Ctrl</kbd>+<kbd>Enter</kbd> Analyze</span>
    <span><kbd>&#8593;</kbd><kbd>&#8595;</kbd> Navigate issues</span>
  </div>
</header>

<div class="container">
  <div class="input-section">
    <div class="input-fields">
      <div class="field-group">
        <label for="headline-input">Headline <span class="optional">(optional)</span></label>
        <input type="text" id="headline-input" placeholder="Paste your headline here...">
      </div>
      <div class="field-group">
        <label for="copy-input">Story text</label>
        <div class="copy-input" id="copy-input" contenteditable="true" data-placeholder="Paste your draft text here..."></div>
      </div>
    </div>
    <div class="input-footer">
      <div class="btn-row">
        <button class="btn btn-primary" id="analyze-btn">Analyze</button>
        <div class="spinner" id="spinner"></div>
        <span class="status-msg" id="status-msg"></span>
      </div>
      <div class="stats-row" id="stats-row">
        <span><strong id="word-count">0</strong> words</span>
        <span>~<strong id="read-time">0</strong> min read</span>
      </div>
    </div>
    <div class="error-msg" id="error-msg"></div>
  </div>

  <!-- Score summary -->
  <div class="score-bar" id="score-bar">
    <div class="score-grade" id="score-grade"></div>
    <div class="score-breakdown" id="score-breakdown"></div>
    <div class="progress-text" id="progress-text"></div>
    <div class="score-actions">
      <button class="btn btn-secondary btn-sm" id="copy-corrected-btn" title="Copy text with accepted fixes applied">Copy corrected text</button>
      <button class="btn btn-secondary btn-sm" id="accept-all-btn">Accept all</button>
    </div>
  </div>

  <!-- Headline analysis -->
  <div class="headline-bar" id="headline-bar">
    <div class="headline-bar-top">
      <div class="headline-score-badge" id="headline-score-badge"></div>
      <div class="headline-bar-title">Headline Analysis</div>
      <div class="headline-ws" id="headline-ws"></div>
    </div>
    <div class="headline-assessment" id="headline-assessment"></div>
    <div class="headline-details" id="headline-details"></div>
    <div class="headline-rewrite" id="headline-rewrite"></div>
  </div>

  <!-- Nut graf assessment -->
  <div class="nut-graf-bar" id="nut-graf-bar">
    <div class="nut-graf-icon" id="nut-graf-icon"></div>
    <div class="nut-graf-content">
      <div class="nut-graf-label" id="nut-graf-label"></div>
      <div class="nut-graf-detail" id="nut-graf-detail"></div>
    </div>
  </div>

  <!-- Filter toggles -->
  <div class="filter-bar" id="filter-bar">
    <button class="filter-btn f-style active" data-cat="style">
      <div class="legend-dot" style="background:var(--red)"></div>
      Style <span class="filter-count" id="filter-count-style"></span>
    </button>
    <button class="filter-btn f-tighten active" data-cat="tighten">
      <div class="legend-dot" style="background:var(--yellow)"></div>
      Tighten <span class="filter-count" id="filter-count-tighten"></span>
    </button>
    <button class="filter-btn f-structure active" data-cat="structure">
      <div class="legend-dot" style="background:var(--blue)"></div>
      Structure <span class="filter-count" id="filter-count-structure"></span>
    </button>
  </div>

  <div class="results" id="results">
    <div class="text-panel">
      <div class="panel-header">
        <h2>Annotated Text</h2>
        <div class="legend">
          <div class="legend-item"><div class="legend-dot" style="background:var(--red-bg);border:1px solid var(--red)"></div> Style</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--yellow-bg);border:1px solid var(--yellow)"></div> Tighten</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--blue-bg);border:1px solid var(--blue)"></div> Structure</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--green-bg);border:1px solid var(--green)"></div> Accepted</div>
        </div>
      </div>
      <div class="text-display" id="text-display"></div>
    </div>
    <div class="issues-panel">
      <div class="panel-header">
        <h2>Issues <span id="issue-count"></span></h2>
      </div>
      <div class="issues-scroll">
        <ul class="issues-list" id="issues-list"></ul>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ---- STATE ----
const WORKER_URL = '/api';
let currentIssues = [];  // cleaned, mapped issues
let issueStates = {};    // { num: 'pending' | 'accepted' | 'dismissed' }
let originalText = '';   // plain text sent to API
let inputHtml = '';      // sanitized HTML from input (with <a> tags)
let linkMap = [];        // [{start, end, href, text}] — positions in plain text
let activeFilters = { style: true, tighten: true, structure: true };
let activeIssueNum = null;

// ---- DOM REFS ----
const headlineInput = document.getElementById('headline-input');
const copyInput = document.getElementById('copy-input');
const analyzeBtn = document.getElementById('analyze-btn');
const spinner = document.getElementById('spinner');
const statusMsg = document.getElementById('status-msg');
const errorMsg = document.getElementById('error-msg');
const resultsDiv = document.getElementById('results');
const textDisplay = document.getElementById('text-display');
const issuesList = document.getElementById('issues-list');
const issueCount = document.getElementById('issue-count');
const scoreBar = document.getElementById('score-bar');
const scoreGrade = document.getElementById('score-grade');
const scoreBreakdown = document.getElementById('score-breakdown');
const progressText = document.getElementById('progress-text');
const filterBar = document.getElementById('filter-bar');
const toast = document.getElementById('toast');
const wordCountEl = document.getElementById('word-count');
const readTimeEl = document.getElementById('read-time');

// ---- PASTE HANDLER (preserve only <a> tags) ----
copyInput.addEventListener('paste', (e) => {
  e.preventDefault();
  const html = e.clipboardData.getData('text/html');
  const plain = e.clipboardData.getData('text/plain');

  if (html) {
    const sanitized = sanitizeHtml(html);
    document.execCommand('insertHTML', false, sanitized);
  } else {
    document.execCommand('insertText', false, plain);
  }
  updateStats();
  saveToLocal();
});

function sanitizeHtml(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  return walkAndSanitize(doc.body);
}

function walkAndSanitize(node) {
  let result = '';
  for (const child of node.childNodes) {
    if (child.nodeType === Node.TEXT_NODE) {
      result += escapeHtml(child.textContent);
    } else if (child.nodeType === Node.ELEMENT_NODE) {
      const tag = child.tagName.toLowerCase();
      if (tag === 'a' && child.href) {
        const href = escapeHtml(child.getAttribute('href') || '');
        const inner = walkAndSanitize(child);
        result += `<a href="${href}" target="_blank" rel="noopener">${inner}</a>`;
      } else if (tag === 'br') {
        result += '\n';
      } else if (['p', 'div', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'li', 'blockquote'].includes(tag)) {
        const inner = walkAndSanitize(child);
        if (inner.trim()) result += inner + '\n\n';
      } else {
        result += walkAndSanitize(child);
      }
    }
  }
  return result;
}

// Build a link map from the contenteditable innerHTML
// Returns {plainText, links: [{start, end, href}]}
function extractTextAndLinks(container) {
  const links = [];
  let plain = '';

  function walk(node) {
    for (const child of node.childNodes) {
      if (child.nodeType === Node.TEXT_NODE) {
        plain += child.textContent;
      } else if (child.nodeType === Node.ELEMENT_NODE) {
        const tag = child.tagName.toLowerCase();
        if (tag === 'a') {
          const start = plain.length;
          walk(child);
          links.push({ start, end: plain.length, href: child.getAttribute('href') || '' });
        } else if (tag === 'br') {
          plain += '\n';
        } else if (['div', 'p'].includes(tag)) {
          if (plain.length > 0 && !plain.endsWith('\n')) plain += '\n';
          walk(child);
          if (!plain.endsWith('\n')) plain += '\n';
        } else {
          walk(child);
        }
      }
    }
  }

  walk(container);
  return { plainText: plain.replace(/\n{3,}/g, '\n\n').trim(), links };
}

// ---- STATS ----
function updateStats() {
  const text = (copyInput.innerText || '').trim();
  const words = text ? text.split(/\s+/).length : 0;
  const minutes = Math.max(1, Math.round(words / 230));
  wordCountEl.textContent = words;
  readTimeEl.textContent = words === 0 ? '0' : minutes;
}

copyInput.addEventListener('input', updateStats);
updateStats();

// ---- AUTO-SAVE ----
function saveToLocal() {
  try {
    localStorage.setItem('bdn-style-headline', headlineInput.value);
    localStorage.setItem('bdn-style-copy-html', copyInput.innerHTML);
  } catch(e) {}
}

function loadFromLocal() {
  try {
    const h = localStorage.getItem('bdn-style-headline');
    const c = localStorage.getItem('bdn-style-copy-html');
    if (h) headlineInput.value = h;
    if (c) { copyInput.innerHTML = c; updateStats(); }
  } catch(e) {}
}

headlineInput.addEventListener('input', saveToLocal);
copyInput.addEventListener('input', saveToLocal);
loadFromLocal();

// ---- KEYBOARD SHORTCUTS ----
document.addEventListener('keydown', (e) => {
  // Ctrl+Enter or Cmd+Enter to analyze
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    if (!analyzeBtn.disabled) analyze();
    return;
  }

  // Arrow keys to navigate issues (only when not in an input)
  if (currentIssues.length === 0) return;
  if (e.target.tagName === 'INPUT' || e.target.isContentEditable) return;

  const visible = currentIssues.filter(c => activeFilters[c.category]);
  if (visible.length === 0) return;

  if (e.key === 'ArrowDown' || e.key === 'j') {
    e.preventDefault();
    const curIdx = visible.findIndex(c => c.num === activeIssueNum);
    const next = curIdx < visible.length - 1 ? visible[curIdx + 1] : visible[0];
    scrollToHighlight(next.num);
  } else if (e.key === 'ArrowUp' || e.key === 'k') {
    e.preventDefault();
    const curIdx = visible.findIndex(c => c.num === activeIssueNum);
    const prev = curIdx > 0 ? visible[curIdx - 1] : visible[visible.length - 1];
    scrollToHighlight(prev.num);
  } else if (e.key === 'a' && activeIssueNum != null) {
    e.preventDefault();
    acceptIssue(activeIssueNum);
  } else if (e.key === 'd' && activeIssueNum != null) {
    e.preventDefault();
    dismissIssue(activeIssueNum);
  }
});

// ---- FILTER TOGGLES ----
filterBar.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const cat = btn.dataset.cat;
    activeFilters[cat] = !activeFilters[cat];
    btn.classList.toggle('active', activeFilters[cat]);
    applyFilters();
  });
});

function applyFilters() {
  // Toggle issue visibility
  issuesList.querySelectorAll('.issue-item').forEach(li => {
    const cat = li.dataset.cat;
    li.style.display = activeFilters[cat] ? '' : 'none';
  });
  // Toggle highlight visibility
  textDisplay.querySelectorAll('.highlight').forEach(hl => {
    const num = parseInt(hl.dataset.issue);
    const issue = currentIssues.find(c => c.num === num);
    if (issue) {
      hl.classList.toggle('filtered-out', !activeFilters[issue.category]);
    }
  });
  updateIssueCount();
}

function updateIssueCount() {
  const visible = currentIssues.filter(c => activeFilters[c.category]);
  issueCount.textContent = `(${visible.length})`;
}

// ---- ANALYZE ----
analyzeBtn.addEventListener('click', analyze);

async function analyze() {
  const headline = headlineInput.value.trim();
  const extracted = extractTextAndLinks(copyInput);
  const body = extracted.plainText;
  inputHtml = copyInput.innerHTML;
  linkMap = extracted.links;

  errorMsg.textContent = '';

  if (!body && !headline) {
    errorMsg.textContent = 'Please paste some text to analyze.';
    return;
  }

  analyzeBtn.disabled = true;
  spinner.classList.add('active');
  statusMsg.textContent = 'Analyzing copy...';
  resultsDiv.classList.remove('visible');
  scoreBar.classList.remove('visible');
  filterBar.classList.remove('visible');
  document.getElementById('nut-graf-bar').classList.remove('visible', 'found', 'missing');
  document.getElementById('headline-bar').classList.remove('visible', 'score-strong', 'score-adequate', 'score-weak');

  try {
    const headers = { 'Content-Type': 'application/json' };
    if (window.BDN_STYLE_TOKEN) headers['x-bdn-token'] = window.BDN_STYLE_TOKEN;
    const response = await fetch(WORKER_URL, {
      method: 'POST',
      headers,
      body: JSON.stringify({ headline, story: body })
    });

    const data = await response.json().catch(() => null);
    if (!response.ok) {
      const detail = data?.error?.message || response.statusText;
      throw new Error(`API error (${response.status}): ${detail}`);
    }

    const parsed = data.result;
    if (!parsed) throw new Error('Empty analysis returned.');

    // The display text is what we annotate — headline (if present) + body
    originalText = '';
    if (headline) originalText += headline + '\n\n';
    originalText += body;

    // Adjust link positions if headline was prepended
    if (headline) {
      const offset = headline.length + 2;
      linkMap = linkMap.map(l => ({ ...l, start: l.start + offset, end: l.end + offset }));
    }

    // Display headline analysis and nut graf assessment
    renderHeadlineAnalysis(parsed.headline_analysis);
    renderNutGraf(parsed.nut_graf);

    const issues = (parsed.issues || []).filter(issue => {
      if (!issue.original || !issue.suggestion) return true;
      if (issue.suggestion === '[CUT]') return true;
      const suggestionCore = issue.suggestion.trim().toLowerCase();
      const originalCore = issue.original.trim().toLowerCase();
      if (suggestionCore === originalCore) return false;
      if (originalText.includes(issue.suggestion.trim())) return false;
      return true;
    });

    renderResults(originalText, issues);
    statusMsg.textContent = `Found ${issues.length} issue${issues.length !== 1 ? 's' : ''}.`;
  } catch (err) {
    errorMsg.textContent = err.message;
    statusMsg.textContent = '';
  } finally {
    analyzeBtn.disabled = false;
    spinner.classList.remove('active');
  }
}

// ---- RENDER ----
function renderResults(text, issues) {
  resultsDiv.classList.add('visible');
  issuesList.innerHTML = '';
  currentIssues = [];
  issueStates = {};
  activeIssueNum = null;

  if (issues.length === 0) {
    textDisplay.innerHTML = renderTextWithLinks(text, linkMap);
    issuesList.innerHTML = '<li class="no-issues">No style issues found. Nice work!</li>';
    issueCount.textContent = '(0)';
    scoreBar.classList.add('visible');
    scoreGrade.textContent = 'A';
    scoreGrade.style.color = 'var(--green)';
    scoreBreakdown.innerHTML = '<span style="color:var(--green);font-weight:600">Clean copy!</span>';
    progressText.textContent = '';
    filterBar.classList.remove('visible');
    return;
  }

  // Map issues to text positions
  const mapped = [];
  for (let i = 0; i < issues.length; i++) {
    const issue = issues[i];
    const idx = text.indexOf(issue.original);
    if (idx === -1) continue;
    mapped.push({ ...issue, start: idx, end: idx + issue.original.length, num: mapped.length + 1 });
  }

  mapped.sort((a, b) => a.start - b.start);

  // Remove overlaps
  const clean = [];
  let lastEnd = 0;
  for (const m of mapped) {
    if (m.start >= lastEnd) {
      clean.push(m);
      lastEnd = m.end;
    }
  }

  clean.forEach((c, i) => { c.num = i + 1; });
  currentIssues = clean;

  // Init states
  clean.forEach(c => { issueStates[c.num] = 'pending'; });

  // Build annotated HTML preserving links
  textDisplay.innerHTML = buildAnnotatedHtml(text, clean);


  // Build issues list
  for (const c of clean) {
    const catLabel = c.category === 'style' ? 'Style' : c.category === 'tighten' ? 'Tighten' : 'Structure';
    const li = document.createElement('li');
    li.className = `issue-item cat-${c.category}`;
    li.dataset.issue = c.num;
    li.dataset.cat = c.category;
    li.innerHTML = `
      <div class="issue-top">
        <div class="issue-top-left">
          <span class="issue-num">${c.num}</span>
          <span class="issue-cat-label">${catLabel}</span>
        </div>
      </div>
      <div class="issue-original">"${escapeHtml(truncate(c.original, 120))}"</div>
      <div class="issue-suggestion">&rarr; ${escapeHtml(c.suggestion)}</div>
      <div class="issue-explanation">${escapeHtml(c.explanation)}</div>
      <div class="issue-actions">
        <button class="btn-accept" data-num="${c.num}">Accept</button>
        <button class="btn-dismiss" data-num="${c.num}">Dismiss</button>
      </div>
      <div class="issue-status" data-status-num="${c.num}"></div>
    `;
    li.querySelector('.issue-top').addEventListener('click', () => scrollToHighlight(c.num));
    li.querySelector('.btn-accept').addEventListener('click', (e) => { e.stopPropagation(); acceptIssue(c.num); });
    li.querySelector('.btn-dismiss').addEventListener('click', (e) => { e.stopPropagation(); dismissIssue(c.num); });
    issuesList.appendChild(li);
  }

  // Click highlights to scroll to issue
  textDisplay.querySelectorAll('.highlight').forEach(el => {
    el.addEventListener('click', () => {
      const num = parseInt(el.dataset.issue);
      scrollToHighlight(num);
    });
  });

  // Score + filters
  updateScore();
  updateFilterCounts();
  filterBar.classList.add('visible');
  scoreBar.classList.add('visible');
}

// ---- ACCEPT / DISMISS ----
function acceptIssue(num) {
  if (issueStates[num] !== 'pending') return;
  issueStates[num] = 'accepted';
  updateIssueUI(num);
  updateScore();
}

function dismissIssue(num) {
  if (issueStates[num] !== 'pending') return;
  issueStates[num] = 'dismissed';
  updateIssueUI(num);
  updateScore();
}

function updateIssueUI(num) {
  const state = issueStates[num];
  const li = issuesList.querySelector(`li[data-issue="${num}"]`);
  const hl = textDisplay.querySelector(`[data-issue="${num}"]`);

  if (li) {
    li.classList.toggle('resolved', state !== 'pending');
    const statusEl = li.querySelector(`[data-status-num="${num}"]`);
    if (statusEl) {
      if (state === 'accepted') {
        statusEl.className = 'issue-status status-accepted';
        statusEl.textContent = 'Accepted';
      } else if (state === 'dismissed') {
        statusEl.className = 'issue-status status-dismissed';
        statusEl.textContent = 'Dismissed';
      } else {
        statusEl.textContent = '';
      }
    }
  }

  if (hl) {
    hl.classList.remove('accepted', 'dismissed');
    if (state === 'accepted') hl.classList.add('accepted');
    if (state === 'dismissed') hl.classList.add('dismissed');
  }
}

// ---- SCORE ----
function updateScore() {
  const total = currentIssues.length;
  if (total === 0) return;

  const counts = { style: 0, tighten: 0, structure: 0 };
  const pending = { style: 0, tighten: 0, structure: 0 };
  currentIssues.forEach(c => {
    counts[c.category]++;
    if (issueStates[c.num] === 'pending') pending[c.category]++;
  });

  const resolved = Object.values(issueStates).filter(s => s !== 'pending').length;

  // Grade based on pending issues
  const pendingCount = total - resolved;
  let grade, color;
  if (pendingCount === 0) { grade = 'A'; color = 'var(--green)'; }
  else if (pendingCount <= 2) { grade = 'B'; color = 'var(--blue)'; }
  else if (pendingCount <= 5) { grade = 'C'; color = 'var(--yellow)'; }
  else { grade = 'D'; color = 'var(--red)'; }

  scoreGrade.textContent = grade;
  scoreGrade.style.color = color;

  scoreBreakdown.innerHTML = `
    <div class="score-cat"><div class="score-dot" style="background:var(--red)"></div> ${counts.style} style</div>
    <div class="score-cat"><div class="score-dot" style="background:var(--yellow)"></div> ${counts.tighten} tighten</div>
    <div class="score-cat"><div class="score-dot" style="background:var(--blue)"></div> ${counts.structure} structure</div>
  `;

  progressText.textContent = resolved > 0 ? `${resolved}/${total} reviewed` : '';
}

function updateFilterCounts() {
  const counts = { style: 0, tighten: 0, structure: 0 };
  currentIssues.forEach(c => counts[c.category]++);
  document.getElementById('filter-count-style').textContent = `(${counts.style})`;
  document.getElementById('filter-count-tighten').textContent = `(${counts.tighten})`;
  document.getElementById('filter-count-structure').textContent = `(${counts.structure})`;
}

// ---- COPY CORRECTED TEXT ----
document.getElementById('copy-corrected-btn').addEventListener('click', () => {
  const correctedHtml = buildCorrectedHtml();
  // Copy as rich text (HTML) so links are preserved when pasting into CMS/docs
  const blob = new Blob([correctedHtml], { type: 'text/html' });
  const plainText = buildCorrectedPlainText();
  navigator.clipboard.write([
    new ClipboardItem({
      'text/html': blob,
      'text/plain': new Blob([plainText], { type: 'text/plain' })
    })
  ]).then(() => {
    showToast('Corrected text copied with links');
  }).catch(() => {
    // Fallback: plain text only
    navigator.clipboard.writeText(plainText).then(() => {
      showToast('Corrected text copied (plain text)');
    });
  });
});

function buildCorrectedPlainText() {
  let text = originalText;
  const accepted = currentIssues
    .filter(c => issueStates[c.num] === 'accepted')
    .sort((a, b) => b.start - a.start);
  for (const issue of accepted) {
    const replacement = issue.suggestion === '[CUT]' ? '' : issue.suggestion;
    text = text.slice(0, issue.start) + replacement + text.slice(issue.end);
  }
  return text.replace(/\n{3,}/g, '\n\n').trim();
}

function buildCorrectedHtml() {
  // Apply accepted fixes to plain text, adjusting link positions
  let text = originalText;
  let adjustedLinks = linkMap.map(l => ({ ...l }));

  const accepted = currentIssues
    .filter(c => issueStates[c.num] === 'accepted')
    .sort((a, b) => b.start - a.start);

  for (const issue of accepted) {
    const replacement = issue.suggestion === '[CUT]' ? '' : issue.suggestion;
    const delta = replacement.length - (issue.end - issue.start);
    text = text.slice(0, issue.start) + replacement + text.slice(issue.end);
    // Adjust link positions
    adjustedLinks = adjustedLinks.filter(l => {
      // Remove links entirely inside a cut/replaced region
      if (l.start >= issue.start && l.end <= issue.end) return false;
      return true;
    }).map(l => {
      if (l.start >= issue.end) {
        return { ...l, start: l.start + delta, end: l.end + delta };
      }
      return l;
    });
  }

  text = text.replace(/\n{3,}/g, '\n\n').trim();
  return renderTextWithLinks(text, adjustedLinks);
}

// Render plain text with links reinserted as <a> tags
function renderTextWithLinks(text, links) {
  const sorted = [...links].sort((a, b) => a.start - b.start);
  let html = '';
  let pos = 0;
  for (const link of sorted) {
    if (link.start < pos || link.start >= text.length) continue;
    if (link.start > pos) html += escapeHtml(text.slice(pos, link.start));
    const linkText = text.slice(link.start, Math.min(link.end, text.length));
    html += `<a href="${escapeHtml(link.href)}">${escapeHtml(linkText)}</a>`;
    pos = Math.min(link.end, text.length);
  }
  if (pos < text.length) html += escapeHtml(text.slice(pos));
  return html;
}

// ---- ACCEPT ALL ----
document.getElementById('accept-all-btn').addEventListener('click', () => {
  let count = 0;
  currentIssues.forEach(c => {
    if (issueStates[c.num] === 'pending' && activeFilters[c.category]) {
      issueStates[c.num] = 'accepted';
      updateIssueUI(c.num);
      count++;
    }
  });
  updateScore();
  if (count > 0) showToast(`Accepted ${count} issue${count !== 1 ? 's' : ''}`);
});

// ---- NAVIGATION ----
function scrollToHighlight(num) {
  clearActive();
  activeIssueNum = num;
  const hl = textDisplay.querySelector(`[data-issue="${num}"]`);
  const li = issuesList.querySelector(`li[data-issue="${num}"]`);
  if (hl) {
    hl.classList.add('active-highlight');
    hl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  if (li) {
    li.classList.add('active-issue');
    li.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

function clearActive() {
  document.querySelectorAll('.active-highlight').forEach(el => el.classList.remove('active-highlight'));
  document.querySelectorAll('.active-issue').forEach(el => el.classList.remove('active-issue'));
}

// ---- ANNOTATED HTML WITH LINKS ----
function buildAnnotatedHtml(text, issues) {
  // Build a list of "events" (highlight starts/ends + link starts/ends) sorted by position
  // Then walk through text emitting the right tags
  const events = []; // {pos, type: 'hl-start'|'hl-end'|'link-start'|'link-end', ...}

  for (const c of issues) {
    events.push({ pos: c.start, type: 'hl-start', issue: c });
    events.push({ pos: c.end, type: 'hl-end', issue: c });
  }
  for (const l of linkMap) {
    if (l.start < text.length) {
      events.push({ pos: l.start, type: 'link-start', href: l.href });
      events.push({ pos: Math.min(l.end, text.length), type: 'link-end' });
    }
  }

  // Sort: by position, then ends before starts at same position
  events.sort((a, b) => {
    if (a.pos !== b.pos) return a.pos - b.pos;
    const order = { 'hl-end': 0, 'link-end': 1, 'link-start': 2, 'hl-start': 3 };
    return order[a.type] - order[b.type];
  });

  let html = '';
  let pos = 0;
  let inHighlight = null;
  let inLink = null;

  for (const ev of events) {
    // Emit text up to this event
    if (ev.pos > pos) {
      html += escapeHtml(text.slice(pos, ev.pos));
      pos = ev.pos;
    }

    if (ev.type === 'hl-start') {
      const cls = `highlight highlight-${ev.issue.category}`;
      html += `<span class="${cls}" data-issue="${ev.issue.num}">`;
      inHighlight = ev.issue;
    } else if (ev.type === 'hl-end') {
      html += '</span>';
      inHighlight = null;
    } else if (ev.type === 'link-start') {
      html += `<a href="${escapeHtml(ev.href)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">`;
      inLink = ev;
    } else if (ev.type === 'link-end') {
      html += '</a>';
      inLink = null;
    }
  }

  // Remaining text
  if (pos < text.length) html += escapeHtml(text.slice(pos));

  return html;
}

// ---- HEADLINE ANALYSIS ----
function renderHeadlineAnalysis(analysis) {
  const bar = document.getElementById('headline-bar');
  bar.classList.remove('visible', 'score-strong', 'score-adequate', 'score-weak');

  if (!analysis) return;

  bar.classList.add('visible', `score-${analysis.score}`);

  // Badge
  document.getElementById('headline-score-badge').textContent = analysis.score;

  // W's display
  const allWs = ['who', 'what', 'when', 'where', 'why'];
  const answered = (analysis.ws_answered || []).map(w => w.toLowerCase());
  const wsHtml = allWs.map(w => {
    if (answered.includes(w)) {
      return `<span class="w-answered">${w.charAt(0).toUpperCase() + w.slice(1)}</span>`;
    }
    return `<span class="w-missing">${w.charAt(0).toUpperCase() + w.slice(1)}</span>`;
  }).join(' &middot; ');
  document.getElementById('headline-ws').innerHTML = wsHtml;

  // Assessment
  document.getElementById('headline-assessment').textContent = analysis.assessment || '';

  // Details: verb + red flags
  const detailsEl = document.getElementById('headline-details');
  let detailsHtml = '';
  if (analysis.verb) {
    detailsHtml += `<div class="headline-detail-item"><span class="headline-detail-label">Verb:</span> <span class="headline-detail-value">${escapeHtml(analysis.verb)}</span></div>`;
  }
  if (analysis.red_flags && analysis.red_flags.length > 0) {
    const flags = analysis.red_flags.map(f => `<span class="red-flag-tag">${escapeHtml(f)}</span>`).join(' ');
    detailsHtml += `<div class="headline-detail-item"><span class="headline-detail-label">Red flags:</span> ${flags}</div>`;
  }
  detailsEl.innerHTML = detailsHtml;

  // Suggested rewrite
  const rewriteEl = document.getElementById('headline-rewrite');
  if (analysis.suggested_rewrite && analysis.score !== 'strong') {
    rewriteEl.classList.add('visible');
    rewriteEl.innerHTML = `<div class="headline-rewrite-label">Suggested rewrite</div><div class="headline-rewrite-text">${escapeHtml(analysis.suggested_rewrite)}</div>`;
  } else {
    rewriteEl.classList.remove('visible');
    rewriteEl.innerHTML = '';
  }
}

// ---- NUT GRAF ----
function renderNutGraf(nutGraf) {
  const bar = document.getElementById('nut-graf-bar');
  const icon = document.getElementById('nut-graf-icon');
  const label = document.getElementById('nut-graf-label');
  const detail = document.getElementById('nut-graf-detail');

  if (!nutGraf) {
    bar.classList.remove('visible');
    return;
  }

  bar.classList.add('visible');
  bar.classList.remove('found', 'missing');

  if (nutGraf.found) {
    bar.classList.add('found');
    icon.textContent = '\u2713';
    label.textContent = `Nut graf found (paragraph ${nutGraf.location || '?'})`;
    let detailHtml = escapeHtml(nutGraf.assessment || '');
    if (nutGraf.text) {
      detailHtml += ` <em>"${escapeHtml(truncate(nutGraf.text, 100))}"</em>`;
    }
    detail.innerHTML = detailHtml;
  } else {
    bar.classList.add('missing');
    icon.textContent = '\u2717';
    label.textContent = 'Missing nut graf';
    detail.textContent = nutGraf.assessment || 'This story needs a paragraph near the top that tells the reader why this matters now.';
  }
}

// ---- HELPERS ----
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function truncate(str, len) {
  if (str.length <= len) return str;
  return str.slice(0, len) + '...';
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}
